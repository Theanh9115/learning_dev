<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="./style.css" type="text/css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div id="sidebar">
                <div id="logo-section">
                    <img id="logo-image" src="https://raw.githubusercontent.com/TheOdinProject/curriculum/5f37d43908ef92499e95a9b90fc3cc291a95014c/html_css/project-sign-up-form/odin-lined.png" alt="Odin Logo">
                    <h1>Odin</h1>
                </div>
            </div>
            <main>
                <div id="intro" class="content">
                    <p class="intro-description">This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <i>now</i> to get started.</p>
                    <p class="intro-description">You <i>know</i> you want to.</p>
                </div>
        
                <div id="form-section">
                    <p class="content">Let's do this!</p>
                    <form id="signup-form" class="content" action="">
                        <div class="form-container">
                            <div class="left">
                                <div class="form-element">
                                    <label class="form-label" for="fname">FIRST NAME</label>
                                    <br>
                                    <input class="form-input" type="text" id="fname" name="fname">
                                </div>
                                <div class="form-element">
                                    <label class="form-label" for="user-email">EMAIL</label>
                                    <br>
                                    <input class="form-input" type="email" id="user-email" name="user-email">
                                </div>
                                <div class="form-element">
                                    <label class="form-label" for="user-password">PASSWORD</label>
                                    <br>
                                    <input class="form-input" type="password" id="user-password" name="user-password" minlength="10">
                                </div>                
                            </div>
                            <div class="right">
                                <div class="form-element">
                                    <label class="form-label" for="lname">LAST NAME</label>
                                    <br>
                                    <input class="form-input" type="text" id="lname" name="lname">
                                </div>                
                                <div class="form-element">
                                    <label class="form-label" for="phone-number">PHONE NUMBER</label>
                                    <br>
                                    <input class="form-input" type="tel" id="phone-number" name="phone-number">
                                </div>
                                <div class="form-element">
                                    <label class="form-label" for="confirm-password">CONFIRM PASSWORD</label>
                                    <br>
                                    <input class="form-input" type="password" id="confirm-password" minlength="10">
                                </div>                
                            </div>
                        </div>
                    </form>
                </div>
                <div class="content">
                    <button form="signup-form" type="submit">Create Account</button>
                    <p id="login-text">Already have an account? <a href="">Log in</a></p>
                </div>
                
                
            </main>
        </div>

    </body>
</html>
