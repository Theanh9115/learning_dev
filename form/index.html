<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="./style.css" type="text/css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div id="sidebar">
                <div id="logo-section">
                    <img id="logo-image" src="https://raw.githubusercontent.com/TheOdinProject/curriculum/5f37d43908ef92499e95a9b90fc3cc291a95014c/html_css/project-sign-up-form/odin-lined.png" alt="Odin Logo">
                    <h1>Odin</h1>
                </div>
            </div>
            <main>
                <div id="intro" class="content">
                    <p class="intro-description">This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <i>now</i> to get started.</p>
                    <p class="intro-description">You <i>know</i> you want to.</p>
                </div>
        
                <div id="form-section">
                    <p class="content">Let's do this!</p>
                    <form class="content" action="">
                        <div>
                            <label for="fname">FIRST NAME</label>
                            <input type="text" id="fname" name="fname">
                        </div>
                        <div>
                            <label for="lname">LAST NAME</label>
                            <input type="text" id="lname" name="lname">
                        </div>                
                        <div>
                            <label for="user-email">EMAIL</label>
                            <input type="email" id="user-email" name="user-email">
                        </div>
                        <div>
                            <label for="phone-number">PHONE NUMBER</label>
                            <input type="tel" id="phone-number" name="phone-number">
                        </div>
                        <div>
                            <label for="user-password">PASSWORD</label>
                            <input type="password" id="user-password" name="user-password">
                        </div>                
                        <div>
                            <label for="confirm-password">CONFIRM PASSWORD</label>
                            <input type="password" id="confirm-password">
                        </div>                
                    </form>
                </div>
                <div class="content">
                    <button type="submit">Create Account</button>
                    <p>Already have an account? <a href="">Login</a></p>
                </div>
                
                
            </main>
        </div>

    </body>
</html>
