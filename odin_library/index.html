<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>My Library</h1>
      <form id="book-form" action="">
        <label for="book-name">Book Name:</label>
        <input type="text" name="book-name" id="book-name" required />

        <label for="book-author">Book Author:</label>
        <input type="text" name="book-author" id="book-author" required />

        <label for="book-genre">Book Genre:</label>
        <input type="text" name="book-genre" id="book-genre" required />

        <button type="submit" class="add-book">Add</button>
      </form>
      <div class="books"></div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
